<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DormMate</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>DormMate</h1>

  <section class="input-area">
    <h2>环境输入</h2>
    <div class="input-fields">
      <div class="field">
        <label for="temperature">温度（℃）</label>
        <input type="text" id="temperature" inputmode="decimal" placeholder="如 25">
      </div>
      <div class="field">
        <label for="humidity">湿度（%）</label>
        <input type="text" id="humidity" inputmode="decimal" placeholder="如 55">
      </div>
    </div>
    <button id="analyzeBtn" type="button">分析环境</button>
  </section>

  <p id="errorMsg" class="error" hidden></p>

  <section class="result-area">
    <h2>当前状态</h2>
    <p id="statusText">—</p>
    <p id="adviceText">—</p>
  </section>

  <section class="history-area">
    <h2>历史记录</h2>
    <ul id="historyList"></ul>
    <button id="exportBtn" type="button">导出 CSV</button>
  </section>

  <section class="camera-area">
    <h2>现场快照（Camera）</h2>
    <video id="cameraVideo" autoplay playsinline muted></video>
    <div class="camera-buttons">
      <button id="startCameraBtn" type="button">打开摄像头</button>
      <button id="snapshotBtn" type="button" disabled>保存快照</button>
      <button id="stopCameraBtn" type="button" disabled>关闭摄像头</button>
    </div>
    <p id="cameraMsg" class="hint" hidden></p>
  </section>

  <script src="script.js"></script>
</body>
</html>
