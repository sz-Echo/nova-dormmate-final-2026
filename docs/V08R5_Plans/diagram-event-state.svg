<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5b6b7b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="920" height="430" fill="#ffffff"/>
  <text x="460" y="30" text-anchor="middle" font-size="19" font-weight="bold" fill="#2b3a48">D3 事件生命周期状态图（OPEN → HANDLING → RECOVERED）</text>

  <!-- 状态节点 -->
  <ellipse cx="200" cy="110" rx="115" ry="52" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="200" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">OPEN 发现异常</text>
  <text x="200" y="124" text-anchor="middle" font-size="11" fill="#5b6b7b">新 env 数据 status 异常（规则重算）</text>
  <text x="200" y="140" text-anchor="middle" font-size="11" fill="#5b6b7b">建事件草稿 · 发布 event OPEN</text>

  <ellipse cx="460" cy="110" rx="115" ry="52" fill="#fff4e5" stroke="#c97a1b" stroke-width="2"/>
  <text x="460" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#c97a1b">HANDLING 处理中</text>
  <text x="460" y="124" text-anchor="middle" font-size="11" fill="#5b6b7b">fan_on 经 action topic 发布</text>
  <text x="460" y="140" text-anchor="middle" font-size="11" fill="#5b6b7b">发布 event HANDLING</text>

  <ellipse cx="720" cy="110" rx="120" ry="52" fill="#eaf7ee" stroke="#1f8a4c" stroke-width="2"/>
  <text x="720" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1f8a4c">RECOVERED 已恢复</text>
  <text x="720" y="124" text-anchor="middle" font-size="11" fill="#5b6b7b">连续 ≥2 条新数据 status 正常</text>
  <text x="720" y="140" text-anchor="middle" font-size="11" fill="#5b6b7b">自动 fan_off · 发布 event RECOVERED</text>

  <line x1="315" y1="110" x2="341" y2="110" stroke="#5b6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <line x1="575" y1="110" x2="596" y2="110" stroke="#5b6b7b" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="328" y="98" text-anchor="middle" font-size="10.5" fill="#5b6b7b">处理动作</text>
  <text x="585" y="98" text-anchor="middle" font-size="10.5" fill="#5b6b7b">新数据验证</text>

  <!-- 分支：处理中仍异常 -->
  <path d="M 460 162 L 460 208 L 200 208 L 200 166" fill="none" stroke="#c97a1b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="330" y="226" text-anchor="middle" font-size="11" fill="#c97a1b">期间新数据仍异常 → 保持 HANDLING，继续提示</text>

  <!-- 分支：恢复后异常回归 -->
  <path d="M 720 162 L 720 258 L 200 258 L 200 166" fill="none" stroke="#c0392b" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="460" y="276" text-anchor="middle" font-size="11" fill="#c0392b">恢复后新数据再次异常 → 重新 OPEN（"已恢复"展示为瞬态，属正确行为）</text>

  <!-- 触发与约束说明 -->
  <rect x="60" y="308" width="800" height="100" rx="10" fill="#f4f6f8" stroke="#c8d0d8" stroke-width="1.2"/>
  <text x="78" y="332" font-size="12.5" font-weight="bold" fill="#2b3a48">关键约束</text>
  <text x="78" y="354" font-size="11.5" fill="#3a4a5a">· 恢复必须由后续新数据触发——任何端点击按钮都不能把状态改为"已恢复"（任务书 D3 原文）</text>
  <text x="78" y="374" font-size="11.5" fill="#3a4a5a">· 事件状态机唯一持有者 = Dashboard；状态变化发布 dormmate/{nodeId}/event（同一 eventId 贯穿三态），3D 与移动端订阅渲染，不各自维护</text>
  <text x="78" y="394" font-size="11.5" fill="#3a4a5a">· 事件记录 ≥9 字段：标识 / nodeId / 开始时间 / 问题 / 优先理由 / 动作 / 后续验证数据 / 当前状态 / 恢复时间与最终结果</text>
</svg>
