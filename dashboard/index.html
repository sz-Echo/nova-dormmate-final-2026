<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DormMate Dashboard（M5 实时看板）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="status-bar">
    <h1>DormMate 实时看板</h1>
    <div class="status-info">
      <span id="connStatus" class="conn offline">未连接</span>
      <span id="msgCount">收到 0 条</span>
      <span id="dropCount" class="drop" hidden>丢弃 0 条</span>
    </div>
  </header>

  <p id="warnBanner" class="warn" hidden></p>

  <!-- B1 当前总览 + B4 朗读提醒：总览程序成句（priority.js buildOverview）；
       TTS 只读当前提醒（B4 分工：语音适合短提醒，不长读数据） -->
  <div class="overview-wrap">
    <p id="overviewBar" class="overview" hidden></p>
    <button id="speakOverviewBtn" class="speak-btn" hidden>朗读提醒</button>
  </div>

  <!-- A1 优先关注横幅：程序根据三节点历史实时计算（priority.js computePriority），每条消息后自动刷新 -->
  <p id="priorityBanner" class="priority" hidden></p>

  <section class="cards" id="cards"><!-- 三节点卡片由 app.js 渲染 --></section>

  <!-- B2 判断依据：每节点三项指标（连续异常时长/异常次数/当前状态）各附数据来源，优先节点标注原因（程序计算） -->
  <section class="evidence-area">
    <h2>判断依据（B2）</h2>
    <div id="evidenceCards" class="evidence-cards"><!-- 依据卡片由 app.js 渲染 --></div>
  </section>

  <!-- A2 处理动作：对选中节点发布 actionState（dormmate/{nodeId}/action，SPEC §9 A2 / MASTER_PLAN §6.1）
       动作成为系统状态的一部分，不直接改 status（恢复由 A3 新数据触发） -->
  <section class="action-area">
    <h2>处理动作（A2）</h2>
    <div class="action-bar">
      <span>当前节点：<strong id="actionNode">dorm-a</strong></span>
      <button id="fanOnBtn">开启风扇/通风</button>
      <button id="fanOffBtn">关闭风扇</button>
      <span id="actionStateText" class="action-state">尚未处理</span>
    </div>
  </section>

  <!-- E2 语音命令条：Win+H 语音输入法识别文字打进输入框 -> Enter/失焦提交 -> 精确匹配指令（web/script.js 等价 ASR 同款模式）。
       指令：查看 dorm-x（切换操作对象）/ 朗读状态（TTS 读选中节点真实记录）/ 拍照（摄像头快照叠加节点时间状态、关联事件）/
       开启风扇 / 关闭风扇（复用 A2 publishAction）。dash 前缀 id 防与 web/script.js 绑定的 #voiceCommand 等冲突 -->
  <section class="voice-area">
    <h2>语音指令（E2）</h2>
    <div class="voice-bar">
      <input id="dashVoiceCommand" type="text"
             placeholder="Win+H 语音输入，或直接打字。可用指令：查看 dorm-a / 查看 dorm-b / 查看 dorm-c / 朗读状态 / 拍照 / 开启风扇 / 关闭风扇">
      <span id="dashCameraState" class="voice-camera-state"></span>
      <button id="dashCameraStopBtn" class="camera-stop" hidden>关闭摄像头</button>
    </div>
    <video id="dashCameraVideo" hidden autoplay playsinline muted></video>
    <p id="dashVoiceResult" class="voice-hint">语音输入为 Win+H 等价 ASR（原生 SpeechRecognition 国内不可用，README 已知限制）</p>
  </section>

  <!-- A4 今日事件：一次"发现→判断→处理→验证→恢复"的完整记录（程序组装），可导出 events.json 供 report.html 事件复盘 -->
  <section class="event-area">
    <div class="event-head">
      <h2>今日事件（A4）</h2>
      <button id="exportEventsBtn">导出 events.json</button>
    </div>
    <ul id="eventList"><li class="event-empty">暂无事件</li></ul>
  </section>

  <section class="chart-area">
    <div class="chart-head">
      <h2>趋势（Chart.js）</h2>
      <div class="tabs" id="tabs"><!-- 节点切换 tab 由 app.js 渲染 --></div>
    </div>
    <canvas id="trendChart"></canvas>
  </section>

  <!-- 规则复用：M1 同一实现（window.computeStatus / ADVICE / validateInputs），零重写（SPEC §6） -->
  <script src="../web/script.js"></script>
  <!-- MQTT WebSocket 客户端（mqtt.js）与图表（Chart.js）：本地 vendor 文件，防 CDN 网络不稳 -->
  <script src="vendor/mqtt.min.js"></script>
  <script src="vendor/chart.umd.min.js"></script>
  <!-- A1 优先关注纯函数（computeStreak / computePriority，零 DOM） -->
  <script src="priority.js"></script>
  <script src="app.js"></script>
</body>
</html>
